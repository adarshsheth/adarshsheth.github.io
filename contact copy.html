    <style>
        body {
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .card-full-bg {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 254, 254, 0.92) 0%, rgba(255, 254, 254, 0.92) 80%), url('https://res.cloudinary.com/dvklf4dm6/image/upload/c_scale,w_800,q_auto,f_auto/v1779252214/landing_gku5dx.jpg') center/cover no-repeat;
            z-index: -1;
        }

        #card-main {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navh) + 30px) 20px 50px;
            box-sizing: border-box;
        }

        /* ── THE CARD ── */
        .biz-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: color-mix(in srgb, var(--bg) 55%, transparent);
            border: 2.5px solid color-mix(in srgb, var(--border) 45%, transparent);
            border-radius: 18px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            padding: 40px 30px 30px;
            text-align: center;
            animation: cardIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Corner brackets, same motif as homepage about-box */
        .biz-card::before,
        .biz-card::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 24px;
            border: 4px solid var(--accent);
        }

        .biz-card::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
            border-radius: 16px 0 0 0;
        }

        .biz-card::after {
            bottom: -4px;
            right: -4px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 16px 0;
        }

        .card-avatar-wrap {
            width: 118px;
            height: 118px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--g), var(--accent2));
        }

        .card-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--bg);
            display: block;
        }

        .card-name {
            font-weight: 900;
            font-size: clamp(24px, 6vw, 30px);
            letter-spacing: 0.02em;
            color: var(--dimtitle);
            line-height: 1.1;
        }

        .card-title {
            margin-top: 6px;
            font-weight: 800;
            font-size: 12.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--g);
        }

        .card-positions {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            line-height: 1.45;
            color: var(--text);
        }

        .card-positions .pos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card-positions .pos-row i {
            color: var(--g);
            width: 16px;
            text-align: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .card-loc {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--tdim-fr);
            letter-spacing: 0.03em;
        }

        .card-loc i {
            margin-right: 5px;
            color: var(--g);
        }

        .card-div {
            height: 1.5px;
            background: color-mix(in srgb, var(--border) 35%, transparent);
            margin: 22px 0;
            border: none;
        }

        /* Direct contact rows */
        .contact-rows {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 22px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1.5px solid color-mix(in srgb, var(--border) 35%, transparent);
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.25s ease;
            text-align: left;
        }

        .contact-row:hover {
            border-color: var(--g);
            color: var(--g);
            transform: translateY(-2px);
        }

        .contact-row i {
            font-size: 15px;
            width: 18px;
            color: var(--g);
            text-align: center;
            flex-shrink: 0;
        }

        .contact-row span.crlbl {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-row .cr-copy {
            font-size: 11px;
            opacity: 0.55;
        }

        /* Action button grid */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card-actions .hero-btn {
            font-size: 12px;
            padding: 11px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .card-actions .full-span {
            grid-column: 1 / -1;
        }

        /* Affiliations strip */
        .card-affil {
            margin-top: 26px;
        }

        .card-affil-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--tdim-fr);
            margin-bottom: 10px;
        }

        .card-affil-imgs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            opacity: 0.75;
        }

        .card-affil-imgs img {
            height: 22px;
            width: auto;
            object-fit: contain;
            filter: grayscale(100%);
            opacity: 0.8;
            transition: all 0.25s ease;
        }

        .card-affil-imgs img:hover {
            filter: grayscale(0%);
            opacity: 1;
        }

        /* QR */
        .card-qr-toggle {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--tdim-fr);
            cursor: pointer;
            border: none;
            background: none;
            font-family: "Rubik", sans-serif;
            padding: 6px;
        }

        .card-qr-toggle:hover {
            color: var(--g);
        }

        .card-qr-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .card-qr-box.open {
            max-height: 220px;
            margin-top: 14px;
        }

        .card-qr-box img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid color-mix(in srgb, var(--border) 40%, transparent);
            padding: 8px;
            background: white;
        }

        /* Toast for copy feedback */
        #toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: var(--dimtitle);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 480px) {
            .biz-card {
                padding: 34px 22px 26px;
            }
        }
    </style>
</head>

<body>
    <div class="card-full-bg"></div>
    <div id="blur-page"></div>
    <div id="nav-placeholder"></div>
    <script>
        const cachedNav = sessionStorage.getItem("rawNavHTML");

    <main id="card-main">
        <div class="biz-card">

                <img src="media/artwork/bio-img.png" alt="Adarsh Sheth" loading="lazy" decoding="async" />

            <div class="card-name">Adarsh Sheth</div>

            <div class="card-positions">

    <div id="footer-placeholder"></div>
    <div id="toast"></div>

    <script src="script.js"></script>
    <script>
        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
        }

        // Copy-to-clipboard on any contact row (email / linkedin / short link)
        document.querySelectorAll(".contact-row").forEach((row) => {
            row.addEventListener("click", (e) => {
                const label = row.querySelector(".crlbl")?.textContent?.trim();
                if (label && navigator.clipboard) {
                    navigator.clipboard.writeText(
                        label.includes("@") ? label : (label.startsWith("http") ? label : "https://" + label)
                    ).catch(() => { });
                    showToast("Copied " + label);
                }
            });
        });

        // vCard generation + download ("Save Contact")
        document.getElementById("save-contact-btn").addEventListener("click", () => {
            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "N:Sheth;Adarsh;;;",
                "FN:Adarsh Sheth",
                "TITLE:Aerospace Engineer",
                "ORG:Texas A&M University",
                "EMAIL;TYPE=INTERNET:adarshsheth@tamu.edu",
                "URL:https://adarshsheth.github.io",
                "URL:https://www.linkedin.com/in/adarsh-sheth/",
                "ADR;TYPE=WORK:;;College Station;TX;;;USA",
                "NOTE:Aerospace Engineering student focused on vertical flight and systems integration.",
                "END:VCARD",
            ].join("\n");

            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "adarsh-sheth.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Contact saved!");
        });

        // Share card (native share sheet, falls back to clipboard copy)
        document.getElementById("share-btn").addEventListener("click", async () => {
            const shareData = {
                title: "Adarsh Sheth — Aerospace Engineer",
                text: "Here's my digital business card:",
                url: window.location.href,
            };
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (e) { }
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href).catch(() => { });
                showToast("Link copied to clipboard!");
            }
        });

        // QR code (lazy-load on demand)
        document.getElementById("qr-toggle").addEventListener("click", () => {
            const box = document.getElementById("qr-box");
            const img = document.getElementById("qr-img");
            const toggle = document.getElementById("qr-toggle");
            const isOpen = box.classList.toggle("open");
            if (isOpen) {
                if (!img.src) {
                    const target = encodeURIComponent(window.location.href);
                    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${target}`;
                }
                toggle.innerHTML = '<i class="fas fa-qrcode"></i> Hide QR Code';
            } else {
                toggle.innerHTML = '<i class="fas fa-qrcode"></i> Show QR Code';
            }
        });
    </script>
</body>
