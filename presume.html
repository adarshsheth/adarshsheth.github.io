    <script>
        // PASTE YOUR NEW AES ENCRYPTED JSON PAYLOAD HERE
        // PASSWORD
            const encryptedPayload = "U2FsdGVkX1/rgfZYEXp+DjhoPf1YrQGb1exHPcc7KgnN+uj2UiB6RkgJAtdew03WKC5fOYYiLl5Nx2eegSzI7vyLjhVmv/SUxaprEqjWstNhAs7LGD0AguvyHXBoDSMbuj/hGoLszZJVcqpM7miLFYD5gY1+yiGmdhylT/zqE8//B7ZGVjATSGI/wR/8QPjm3v7TwwtviRuFb8/qIkmMgGabmsL7KlWZv5GU1XOF4prsGvO4ntKHVpg5OrCqqzWzbbOJks8EfTA6JuwmCUpsGKSEaTTFQh4ECs8zN16/8qd5rcnKqGmhFHAj0f6JADLGeJb41y6yVqwjakFfs94zOyOYcbGFXsiL3v2Zd3yh/MQg5NIAMO7XZdt0xm7i+fr8";

            // Hardcode the public base PDFs here
            const BASE_RESUMES = {
                'general': 'media/resume/base_general.pdf',
                'vfd': 'media/resume/base_vf.pdf'
                // 'sw': 'media/resume/base_sw.pdf', // Add future resumes here
                // 'se': 'media/resume/base_se.pdf'
            };

            let privateData = null;
            let currentBasePdfUrl = '';
            let currentGeneratedBlobUrl = '';

            function formatLabel(key) {
                const map = {
                    'general': 'General Resume',
                    'vfd': 'Vertical Flight',
                    'sw': 'Software',
                    'se': 'Systems Engineering'
                };
                return map[key.toLowerCase()] || (key.charAt(0).toUpperCase() + key.slice(1));
            }

            async function unlock() {
                const pw = document.getElementById('pw').value;
                const button = document.getElementById('unlock-btn');
                const errorEl = document.getElementById('error');

                try {
                    button.textContent = "UNLOCKING...";
                    errorEl.style.display = 'none';

                    const bytes = CryptoJS.AES.decrypt(encryptedPayload, pw);
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decryptedString) throw new Error("Decryption failed");

                    // Parse the 3 private fields
                    privateData = JSON.parse(decryptedString);

                    // --- DYNAMIC UI GENERATION ---
                    const sbNav = document.getElementById('sb-nav');
                    const filters = document.querySelector('.portfolio-filters');

                    sbNav.innerHTML = '';
                    filters.innerHTML = '';

                    let isFirst = true;
                    // Iterate over the hardcoded BASE_RESUMES instead of the JSON
                    for (const key in BASE_RESUMES) {
                        const label = formatLabel(key);
                        const activeClass = isFirst ? ' active' : '';

                        const sbLink = document.createElement('a');
                        sbLink.className = 'sbn' + activeClass;
                        sbLink.href = '#';
                        sbLink.setAttribute('data-k', key);
                        sbLink.onclick = function (e) { e.preventDefault(); switchResume(key); };
                        sbLink.innerHTML = `<span class="sbdot"></span><span class="sblbl">${label}</span>`;
                        sbNav.appendChild(sbLink);

                        const filterBtn = document.createElement('button');
                        filterBtn.className = 'filter-btn' + activeClass;
                        filterBtn.id = 'tab-' + key;
                        filterBtn.onclick = function () { switchResume(key); };
                        filterBtn.textContent = label.toUpperCase();
                        filters.appendChild(filterBtn);

                        isFirst = false;
                    }

                    currentBasePdfUrl = BASE_RESUMES['general'];

                    document.getElementById('login-wrapper').style.display = 'none';
                    document.getElementById('resume-ui').style.display = 'block';

                    await generateCustomPDF();

                } catch (e) {
                    console.error(e);
                    errorEl.style.display = 'block';
                    button.textContent = "Unlock Document";
                }
            }

            async function switchResume(tabId) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.sbn').forEach(link => link.classList.remove('active'));

                const tab = document.getElementById('tab-' + tabId);
                if (tab) tab.classList.add('active');

                const sbLink = document.querySelector(`.sbn[data-k="${tabId}"]`);
                if (sbLink) sbLink.classList.add('active');

                currentBasePdfUrl = BASE_RESUMES[tabId];
                await generateCustomPDF();
            }

            async function generateCustomPDF() {
                const container = document.getElementById('pdf-container');
                container.style.opacity = '0.3';

                try {
                    const existingPdfBytes = await fetch(currentBasePdfUrl).then(res => res.arrayBuffer());
                    const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                    // const timesFont = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRoman);
                    const form = pdfDoc.getForm();

                    const includeContact = document.getElementById('toggle-contact').checked;
                    const includeGpa = document.getElementById('toggle-gpa').checked;

                    try {
                        const contactField = form.getTextField('ContactField');
                        if (includeContact) {
                            contactField.setText(privateData.contact);
                        } else {
                            contactField.setText(privateData.publicContact);
                        }
                    } catch (e) { console.warn("ContactField missing from base PDF."); }

                    try {
                        const gpaField = form.getTextField('GPAField');
                        if (includeGpa && privateData.gpa) {
                            gpaField.setText(`, GPA: ${privateData.gpa}`);
                        } else {
                            gpaField.setText('');
                        }
                    } catch (e) { console.warn("GPAField missing from base PDF."); }

                    form.flatten();

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });

                    if (currentGeneratedBlobUrl) URL.revokeObjectURL(currentGeneratedBlobUrl);
                    currentGeneratedBlobUrl = URL.createObjectURL(blob);

                    document.getElementById('floating-dl-btn').href = currentGeneratedBlobUrl;

                    await renderPDF(currentGeneratedBlobUrl);

                } catch (err) {
                    console.error("Error generating custom PDF:", err);
                    container.style.opacity = '1';
                }
            }

            const renderPDF = async (pdfUrlToRender) => {
                const container = document.getElementById('pdf-container');
                try {
                    const pdf = await pdfjsLib.getDocument(pdfUrlToRender).promise;
                    container.innerHTML = '';

                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const pageWrapper = document.createElement('div');
                        pageWrapper.className = 'pdf-page-wrapper';

                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page-canvas';
                        const ctx = canvas.getContext('2d');

                        const textLayerDiv = document.createElement('div');
                        textLayerDiv.className = 'textLayer';

                        pageWrapper.appendChild(canvas);
                        pageWrapper.appendChild(textLayerDiv);
                        container.appendChild(pageWrapper);

                        const containerWidth = container.clientWidth || Math.min(window.innerWidth - 96, 1000);
                        const unscaledViewport = page.getViewport({ scale: 1.0 });
                        const displayScale = containerWidth / unscaledViewport.width;
                        const viewport = page.getViewport({ scale: displayScale });

                        const outputScale = (window.devicePixelRatio || 1) * 2;
                        canvas.width = Math.floor(viewport.width * outputScale);
                        canvas.height = Math.floor(viewport.height * outputScale);
                        canvas.style.height = Math.floor(viewport.height) + "px";

                        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                        await page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise;

                        textLayerDiv.style.width = Math.floor(viewport.width) + 'px';
                        textLayerDiv.style.height = Math.floor(viewport.height) + 'px';
                        textLayerDiv.style.setProperty('--scale-factor', displayScale);

                        const textContent = await page.getTextContent();
                        await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textLayerDiv, viewport: viewport, textDivs: [] }).promise;
                    }
                    container.style.opacity = '1';

                } catch (error) {
                    console.error('Error rendering the PDF:', error);
                    container.style.opacity = '1';
                    container.innerHTML = `
            <div style="padding: 50px 20px; text-align: center; color: var(--text);">
                <i class="fas fa-exclamation-triangle" style="font-size: 40px; margin-bottom: 15px; color: #ff6b6b;"></i>
                <h3 style="color: white; margin-bottom: 10px;">Failed to load PDF</h3>
                <p style="font-size: 14px; line-height: 1.5;">${error.message}</p>
            </div>
        `;
                }
            };

            let resizeTimer;
            let lastWidth = window.innerWidth;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.innerWidth !== lastWidth) {
                        lastWidth = window.innerWidth;
                        if (currentGeneratedBlobUrl) renderPDF(currentGeneratedBlobUrl);
                    }
                }, 250);
            });

            const cachedNav = sessionStorage.getItem("rawNavHTML");
            if (cachedNav) {
                document.getElementById("nav-placeholder").outerHTML = cachedNav;
            }
    </script>
