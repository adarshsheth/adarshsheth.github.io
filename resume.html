		/* ── NATIVE PDF VIEWER STYLES ── */
		#pdf-section {
			padding: 10px 48px 52px;
			display: flex;
			justify-content: center;
			min-height: 80vh;
		}

		#pdf-container {
			width: 100%;
			max-width: 1000px;
			/* Adjust max-width to your preference */
			border-radius: 12px;
			overflow: hidden;
			border: 1.5px solid var(--border);
			background: var(--surface);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
			opacity: 1;
			transition: opacity 0.15s ease-in-out;
		}

		.pdf-page-wrapper {
			position: relative;
			width: 100%;
			background-color: white;
			/* Needed for transparent PDF backgrounds */
		}

		.pdf-page-wrapper:not(:last-child) {
			border-bottom: 2px solid var(--border);
		}

		.pdf-page-canvas {
			display: block;
			width: 100%;
			height: auto;
		}

		/* Keep the PDF.js text layer perfectly aligned */
		.textLayer {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			overflow: hidden;
			line-height: 1.0;
		}

		/* Mobile adjustments */
		@media (max-width: 900px) {
			.portfolio-filters {
				margin: 10px 22px 20px;
			}
			.btn-hdr {
				margin-top: 15px;
			}

			#pdf-section {

			}
		}












		/* ── FLOATING DOWNLOAD BUTTON ── */
		.pdf-wrapper {
			position: relative;
			width: 100%;

			margin: 0 auto;
		}

		.floating-dl-btn {
			position: absolute;
			top: 20px;
			right: 25px;
			z-index: 100;
			display: inline-flex;
			align-items: center;
			gap: 8px;

			border: 1.5px solid var(--border);
			color: var(--text);
			font-weight: 700;
			font-size: 11px;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			transition: all 0.2s ease;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
		}

		.floating-dl-btn:hover {
			background: var(--accent2);
			border-color: var(--accent2);
			/* color: var(--bg); */
			color: white;
			transform: translateY(-2px);
		}

		/* Hide it on super small mobile screens if it covers too much text, or adjust positioning */
		@media (max-width: 500px) {

	<script>
		// ── DYNAMIC RESUME LOGIC ──
		let currentPdfUrl = 'media/resume.pdf';
		let privateMap = null;

		// 1. Check if unlocked BEFORE setting the initial URL
		if (sessionStorage.getItem('unlocked') === 'true') {
			try {
				const data = JSON.parse(sessionStorage.getItem('resume_data'));
				if (typeof data === 'string') {
					currentPdfUrl = data;
					privateMap = { general: data };
				} else if (data) {
					privateMap = data;
					currentPdfUrl = data.general || Object.values(data)[0] || currentPdfUrl;
				}

				// --- UPDATE TITLE & ADD BACK BUTTON ---
				document.addEventListener("DOMContentLoaded", () => {
					// Update the Hero Header and Document Title
					const heroTitle = document.querySelector('#hero h1');
					if (heroTitle) heroTitle.innerText = 'PRIVATE RESUME';
					document.title = 'Private Resume | AS';

					// Append an 'Exit Private View' button to the info bar
					const ibar = document.getElementById('ibar');
					if (ibar) {
						const exitBtn = document.createElement('a');
						exitBtn.href = "#";
						exitBtn.className = "pbtn";
						exitBtn.innerHTML = "EXIT PRIVATE VIEW";
						exitBtn.style.marginLeft = "15px";
						exitBtn.onclick = (e) => {
							e.preventDefault();
							sessionStorage.removeItem('unlocked');
							sessionStorage.removeItem('resume_data');
							window.location.reload(); // Reload to restore the public state
						};
						ibar.appendChild(exitBtn);
					}
				});

			} catch (e) {
				console.error("Storage parse error", e);
			}
		}

		function switchResume(tabId, publicPdfUrl) {
			document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
			const tab = document.getElementById('tab-' + tabId);
			if (tab) tab.classList.add('active');

			if (privateMap && privateMap[tabId]) {
				currentPdfUrl = privateMap[tabId];
			} else if (privateMap && privateMap.general) {
				currentPdfUrl = privateMap.general;
			} else {
				currentPdfUrl = publicPdfUrl;
			}

			const dlBtn = document.getElementById('floating-dl-btn');
			if (dlBtn) dlBtn.href = currentPdfUrl;
			renderPDF();
		}

		// ── NATIVE PDF.JS RENDERING ENGINE ──
		const renderPDF = async () => {
			const container = document.getElementById('pdf-container');
			container.style.opacity = '0.3';

			try {
				const pdf = await pdfjsLib.getDocument(currentPdfUrl).promise;
				container.innerHTML = '';

				for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
					const page = await pdf.getPage(pageNum);
					const pageWrapper = document.createElement('div');
					pageWrapper.className = 'pdf-page-wrapper';

					const canvas = document.createElement('canvas');
					canvas.className = 'pdf-page-canvas';
					const ctx = canvas.getContext('2d');

					const textLayerDiv = document.createElement('div');
					textLayerDiv.className = 'textLayer';

					pageWrapper.appendChild(canvas);
					pageWrapper.appendChild(textLayerDiv);
					container.appendChild(pageWrapper);

					const containerWidth = container.clientWidth || Math.min(window.innerWidth - 96, 1000);
					const unscaledViewport = page.getViewport({ scale: 1.0 });
					const displayScale = containerWidth / unscaledViewport.width;
					const viewport = page.getViewport({ scale: displayScale });

					const outputScale = (window.devicePixelRatio || 1) * 2;
					canvas.width = Math.floor(viewport.width * outputScale);
					canvas.height = Math.floor(viewport.height * outputScale);
					canvas.style.height = Math.floor(viewport.height) + "px";

					const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

					await page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise;

					textLayerDiv.style.width = Math.floor(viewport.width) + 'px';
					textLayerDiv.style.height = Math.floor(viewport.height) + 'px';
					textLayerDiv.style.setProperty('--scale-factor', displayScale);

					const textContent = await page.getTextContent();
					await pdfjsLib.renderTextLayer({
						textContentSource: textContent,
						container: textLayerDiv,
						viewport: viewport,
						textDivs: []
					}).promise;
				}
				container.style.opacity = '1';

			} catch (error) {
				console.error('Error rendering the PDF:', error);
				container.style.opacity = '1';
				container.innerHTML = `
		                <div style="padding: 50px 20px; text-align: center; color: var(--text);">
		                    <i class="fas fa-exclamation-triangle" style="font-size: 40px; margin-bottom: 15px; color: #ff6b6b;"></i>
		                    <h3 style="color: white; margin-bottom: 10px;">Failed to load PDF</h3>
		                    <p style="font-size: 14px; line-height: 1.5;">${error.message || 'The file is missing or blocked by browser security (CORS).'}</p>
		                    <p style="font-size: 11px; margin-top: 20px; color: var(--dimtitle); word-break: break-all;"><strong>Attempted URL:</strong><br>${currentPdfUrl}</p>
		                </div>
		            `;
			}
		};

		let resizeTimer;
		let lastWidth = window.innerWidth;
		window.addEventListener('resize', () => {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(() => {
				if (window.innerWidth !== lastWidth) {
					lastWidth = window.innerWidth;
					renderPDF();
				}
			}, 250);
		});

		document.addEventListener("DOMContentLoaded", () => {
			const dlBtn = document.getElementById('floating-dl-btn');
			if (dlBtn) dlBtn.href = currentPdfUrl;
			renderPDF();
		});
	</script>
