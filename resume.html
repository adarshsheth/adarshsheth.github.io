<body>
    <!-- <div data-left-link-bar data-label="PORTFOLIO" data-href="/portfolio"></div> -->
    <div id="blur-page"></div>
    <div id="nav-placeholder"></div>

    <!-- LOCK SCREEN MODAL (Hidden by default) -->
    <div id="login-wrapper" style="display: none;">
        <div class="lock-box">
            <button class="close-modal" onclick="cancelUnlock()">×</button>
            <h2 class="mb-10">SECURE ACCESS</h2>
            <input type="password" id="pw" placeholder="Enter Password"
                onkeypress="if(event.key === 'Enter') unlock()" />
            <button id="unlock-btn" class="unlock-btn" onclick="unlock()">Unlock Document</button>
            <div id="error" style="color: #ff6b6b; font-size: 12px; margin-top: 15px; display: none; font-weight: 500;">
                Incorrect password.</div>
        </div>
    </div>

    <div id="sb-overlay"></div>
    
    <aside id="sb">
        <div id="sb-hdr">Resumes</div>
        <div id="sb-prog">
            <div id="sb-fill"></div>
        </div>
        <nav id="sb-nav">
        </nav>
    </aside>

    <div id="mn">
        <div id="top"></div>

        <section id="hero">
            <!-- <h1 class="uppercase">Résumé</h1> -->
<h1 class="uppercase">Résum<a href="../app-hub.html"
        style="color: inherit !important; text-decoration: none !important; font-weight: inherit !important; cursor: text !important;">é</a></h1>
        </section>

        <!-- PUBLIC / PRIVATE TOGGLE -->
        <div class="visibility-toggle-container">
            <div class="visibility-toggle">
                <label class="toggle-option active" id="label-public">
                    <input type="radio" name="visibility" value="public" checked
                        onchange="handleVisibilityToggle(this)">
                    PUBLIC
                </label>
                <label class="toggle-option" id="label-private">
                    <input type="radio" name="visibility" value="private" onchange="handleVisibilityToggle(this)">
                    PRIVATE
                </label>
            </div>
        </div>

        <!-- TABS UI FOR MULTIPLE RESUMES -->
        <div class="portfolio-filters"></div>

        <!-- PDF VIEWER -->
        <div id="pdf-section">
            <div class="pdf-wrapper">
                <a href="#" id="floating-dl-btn" class="floating-dl-btn">
                    <i class="fas fa-download"></i> DOWNLOAD
                </a>
                <div id="pdf-container"></div>
            </div>
        </div>
        
        <!-- SKILLS SECTION -->
		<section id="sec-skills" class="sb" data-k="skills">
			<div class="sh">
				<span class="sh-r"></span>
				<button class="sh-pulse-btn" onclick="copyAnchorURL('sec-skills'); scrollToSec('sec-skills')">
					<h2>SKILLS</h2>
				</button>
				<span class="sh-r"></span>
			</div>

			<div id="skills-container" class="skills-wrap"></div>
		</section>
    </div>
<div id="footer-placeholder"></div>
