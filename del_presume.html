        function toggleVisibility(radio) {
                currentVisibility = radio.value;

                // Update UI styling
                document.getElementById('label-public').classList.remove('active');
                document.getElementById('label-private').classList.remove('active');
                radio.parentElement.classList.add('active');

                // Re-render the current resume with the new visibility setting
                switchResume(currentTabId);
            }

        async function unlock() {
            const pw = document.getElementById('pw').value;
            const button = document.getElementById('unlock-btn');
            const errorEl = document.getElementById('error');

            try {
                button.textContent = "UNLOCKING...";
                errorEl.style.display = 'none';

                const bytes = CryptoJS.AES.decrypt(encryptedPayload, pw);
                const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedString) throw new Error("Decryption failed");

                privateData = JSON.parse(decryptedString);

                // Generate UI and transition screen
                buildResumeUI(true);
                document.getElementById('login-wrapper').style.display = 'none';
                document.getElementById('resume-ui').style.display = 'block';

                // Load default private resume
                await switchResume('general');

            } catch (e) {
                errorEl.style.display = 'block';
                button.textContent = "Unlock Document";
            }
        }

        async function switchResume(tabId) {
                const resume = masterResumeConfig.find(r => r.id === tabId);
                if (!resume || resume.status !== 'ready') return;

                currentTabId = tabId; // Store current tab for toggling

                document.querySelectorAll('.filter-btn, .sbn').forEach(el => el.classList.remove('active'));

                const tab = document.getElementById('tab-' + tabId);
                if (tab) tab.classList.add('active');
                const sbLink = document.querySelector(`.sbn[data-k="${tabId}"]`);
                if (sbLink) sbLink.classList.add('active');

                currentDownloadName = `AdarshSheth_Resume${resume.fileSuffix}.pdf`;

                // Logic for Public/Private Toggle
                if (currentVisibility === 'private') {
                    // Use private path, but fallback to public if no private exists
                    currentBasePdfUrl = resume.privatePath || resume.publicPath;
                } else {
                    // Use public path
                    currentBasePdfUrl = resume.publicPath;
                }

                // If it's a private-only resume and they toggled to public, handle gracefully (e.g., render blank or switch to general)
                if (resume.isPrivateOnly && currentVisibility === 'public') {
                    console.warn("This resume does not have a public version.");
                    const container = document.getElementById('pdf-container');
                    container.innerHTML = '<div style="padding: 50px 20px; text-align: center; color: var(--text);"><h3>This resume is private only.</h3></div>';
                    return;
                }

                await generateCustomPDF();
            }

        async function generateCustomPDF() {
                const container = document.getElementById('pdf-container');
                container.style.opacity = '0.3';

                try {
                    const existingPdfBytes = await fetch(currentBasePdfUrl).then(res => res.arrayBuffer());
                    const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);

                    // Note: If you still need to inject the decrypted payload data (privateData.contact, etc) 
                    // into PDF text fields, keep the form.getTextField logic here. 
                    // If the public/private PDFs are fully pre-baked, you don't need pdf-lib here at all for presume.

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });

                    if (currentGeneratedBlobUrl) URL.revokeObjectURL(currentGeneratedBlobUrl);
                    currentGeneratedBlobUrl = URL.createObjectURL(blob);

                    const dlBtn = document.getElementById('floating-dl-btn');
                    if (dlBtn) {
                        dlBtn.href = currentGeneratedBlobUrl;
                        dlBtn.download = currentDownloadName;
                    }

                    await renderPDF(currentGeneratedBlobUrl);
                } catch (err) {
                    console.error("Error generating custom PDF:", err);
                    container.style.opacity = '1';
                    container.innerHTML = '<div class="pdf-page-wrapper" style="aspect-ratio: 8.5 / 11; background: white;"></div>';
