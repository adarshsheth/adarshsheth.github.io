<body class="blog-page">
    <div id="blur-page"></div>
    <div id="nav-placeholder"></div>
    <div id="sb-overlay"></div>
    <aside id="sb">
        <div id="sb-hdr">Sections</div>
        <div id="sb-prog">
            <div id="sb-fill"></div>
        </div>
        <nav id="sb-nav">
            <a class="sbn active" href="#top" data-k="top">
                <span class="sbdot"></span>
                <span class="sblbl">Articles</span>
            </a>
        </nav>
    </aside>

    <div id="mn" style="position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column;">
        <div id="post-cover-wrap">
            <img id="post-cover-img" src="" alt="Article Cover" fetchpriority="high">
        </div>

        <div id="top"></div>

        <section id="hero">
            <h1>BLOG</h1>
        </section>

        <!-- <div id="ibar" style="margin:30px 0 -30px 0; background: transparent; border: 0px">
            <p>Welcome to my blog! These are a collection of my articles, projects, and prompted ChatGPT essays that
                cover philosophical, political, and engineering
                topics often with historical, psychological, and sociological influences to understand what we think
                (and have thought) and why.</p>
        </div> -->

        <div id="blog-container" class="blog-container" style="margin-top: 40px; position: relative; flex: 1;">
            <div id="blog-loading"
                style="text-align:center; padding: 40px; color:var(--g); font-weight:700; letter-spacing: 0.1em; text-transform: uppercase;">
                Loading transmission...
            </div>

            <div id="blog-filters" style="display:none; flex-wrap: wrap; gap: 8px; margin-bottom: 40px;"></div>

            <div id="blog-list" class="fw-grid" style="display:none;">
            </div>

            <div id="blog-post" style="display:none;">
                <div class="post-top-nav">
                    <button onclick="window.location.href='?'" class="pbtn"
                        style="border-radius: 100px; margin-bottom: 0;">Back to Feed</button>
                    <div class="post-arrows" id="post-nav-arrows">
                    </div>
                </div>

                <div class="ech" style="padding: 0 0 20px 0;">
                    <h2 id="post-title" class="ect"
                        style="color: var(--blogAlt) !important; font-size: clamp(28px, 3vw, 50px); line-height: 1.1; text-transform: uppercase;">
                    </h2>
                    <div
                        style="color: var(--blogAlt2); font-weight: 700; margin-top: 14px; text-transform: uppercase;">
                        Written by <span id="post-author" style="color: var(--blogAlt); font-weight: 800;"></span>
                    </div>
                    <!-- <div
                        style="color: var(--blogAlt2); font-weight: 700; margin-top: 14px; letter-spacing: 0.1em; text-transform: uppercase; 	font-size: clamp(13px, 0.7vw, 50px);">
                        Written by <span id="post-author" style="color: var(--blogAlt);"></span>
                    </div> -->
                    <div id="post-meta" class="ecm" style="margin-top: 10px; color: var(--blogAlt2);"></div>
                </div>

                <div id="post-body" class="cbody full" style="margin-top:10px; padding: 0;">
                </div>

                <div id="similar-articles-container" style="display: none;">
                    <h1 class="similar-hdr">Similar Articles</h1>
                    <div id="similar-articles-grid" class="similar-grid"></div>
                </div>
            </div>

        </div>

    </div>
    <div id="footer-placeholder"></div>

    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/effects.js"></script>
    
    <script src="js/pages/blog.js"></script>
</body>
