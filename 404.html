<!DOCTYPE html>
<html>

<head>
    <title>Redirecting...</title>
    <script>
        // Define your URL mappings here
        const redirectMap = {
            "/engineering": "/portfolio",
            "/eng": "/portfolio",
            "/en": "/portfolio",
            "/port": "/portfolio",
            "/p": "/portfolio",
            "/engineering-portfolio": "/portfolio",
            "/projects": "/portfolio",
            "/design-teams": "/portfolio",
            "/experience": "/portfolio",

            "/artwork": "/photography",
            "/art": "/photography",
            "/photos": "/photography",
            "/photo": "/photography",
            "/pic": "/photography",
            "/pics": "/photography",
            "/a": "/photography",
            
            "/resumes": "/resume",
            "/r": "/resume",

            "/about": "/",
            "/contact": "/",
            "/about-me": "/",
            "/me": "/",
            "/home": "/",
            "/index": "/"

            // "/": "/portfolio",
            // "/index": "/portfolio"
        };

        // Get the current path (e.g., "/foresite")
        const path = window.location.pathname.replace(/\/$/, "");

        if (redirectMap[path]) {
            // If the typo exists in our list, go to the correct page
            window.location.replace(redirectMap[path]);
        } else {
            // Optional: If no match is found, send them to the home page
            window.location.replace("/portfolio");
        }
    </script>
</head>

<body>
    <p>Redirecting you to the right place...</p>
</body>

</html>
